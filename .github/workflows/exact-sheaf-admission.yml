name: Exact graph-sheaf pure admission
on:
  push:
    branches: [main]
    paths:
      - 'src/exact-graph-admission.mjs'
      - 'src/exact-graph-cohomology.mjs'
      - 'test/exact-graph-*.test.mjs'
      - '.github/workflows/exact-sheaf-admission.yml'
  pull_request:
    paths:
      - 'src/exact-graph-admission.mjs'
      - 'src/exact-graph-cohomology.mjs'
      - 'test/exact-graph-*.test.mjs'
      - '.github/workflows/exact-sheaf-admission.yml'
permissions:
  contents: read
jobs:
  pure-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse both pure source modules and all tests
        run: |
          node --check src/exact-graph-admission.mjs
          node --check src/exact-graph-cohomology.mjs
          node --check test/exact-graph-admission.test.mjs
          node --check test/exact-graph-cohomology.test.mjs
      - name: Refuse invalid work before any 402
        run: node --test test/exact-graph-admission.test.mjs
# The actual SignGraph-dependent integration suite is intentionally not
# represented as passed by this dependency-free admission check.
